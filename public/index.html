<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Moderne Products Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

<header>
  <div class="header-content">
    <img src="https://cdn-icons-png.flaticon.com/512/7078/7078214.png" alt="Products">
    <h1>Products Inventory Dashboard</h1>
  </div>
  
  <div class="header-blob blob1"></div>
  <div class="header-blob blob2"></div>
</header>

<div class="container">

  <div class="collection-grid">
    <div class="collection-item"><img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30"></div>
    <div class="collection-item"><img src="https://images.unsplash.com/photo-1512436991641-6745cdb1723f"></div>
    <div class="collection-item"><img src="https://cdn.shopify.com/s/files/1/0415/3819/1512/files/HO23-BRIXTON-EDITORIAL_FLATS-CategorieSupport_Mens_Pants_5729-2.jpg?v=1702502285"></div>
    <div class="collection-item"><img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff"></div>
    <div class="collection-item"><img src="https://images.unsplash.com/photo-1483985988355-763728e1935b"></div>
    <div class="collection-item"><img src="https://images.unsplash.com/photo-1491553895911-0055eca6402d"></div>
  </div>

  <div class="form-box">
    <h2>Add New Product</h2>
    <input id="name" placeholder="Product Name" />
    <input id="price" placeholder="Product Price" />
    <button class="btn-add" onclick="addProduct()">Add Product</button>
  </div>

  <h2>Product List</h2>
  <div class="products-grid" id="productList"></div>

</div>

<div class="popup" id="popup">
  <div class="popup-box">
    <h3>Update Product</h3>
    <input id="updateName" placeholder="New Name" />
    <input id="updatePrice" placeholder="New Price" />
    <button class="btn-save" onclick="saveUpdate()">Save</button>
    <button class="btn-close" onclick="closePopup()">Cancel</button>
  </div>
</div>

<script>
const API_URL = "http://localhost:5000/api/products";

let currentUpdateId = null;

async function loadProducts() {
  try {
    const res = await fetch(API_URL);
    if (!res.ok) throw new Error("Failed to fetch products.");
    const products = await res.json();

    const list = document.getElementById("productList");
    list.innerHTML = "";

    products.forEach(p => {
      const card = document.createElement("div");
      card.className = "card";

      card.innerHTML = `
        <h3>${p.name}</h3>
        <p>Price: ₱${p.price}</p>
        <div class="card-buttons">
          <button class="btn-update" onclick="openPopup(${p.id}, '${p.name}', ${p.price})">
            Update
          </button>
          <button class="btn-delete" onclick="deleteProduct(${p.id})">
            Delete
          </button>
        </div>
      `;
      list.appendChild(card);
    });
  } catch (err) {
    alert("Error loading products: " + err.message);
    console.error(err);
  }
}

async function addProduct() {
  const name = document.getElementById("name").value.trim();
  const price = parseFloat(document.getElementById("price").value);

  if (!name || isNaN(price) || price < 0) {
    alert("Please enter a valid name and numeric price.");
    return;
  }

  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name, price })
    });
    if (!res.ok) throw new Error("Failed to add product.");
    
    document.getElementById("name").value = "";
    document.getElementById("price").value = "";
    loadProducts();
  } catch (err) {
    alert("Error adding product: " + err.message);
    console.error(err);
  }
}

async function deleteProduct(id) {
  if (!confirm("Are you sure you want to delete this product?")) return;

  try {
    const res = await fetch(`${API_URL}/${id}`, { method: "DELETE" });
    if (!res.ok) throw new Error("Failed to delete product.");
    loadProducts();
  } catch (err) {
    alert("Error deleting product: " + err.message);
    console.error(err);
  }
}

function openPopup(id, name, price) {
  currentUpdateId = id;
  document.getElementById("updateName").value = name;
  document.getElementById("updatePrice").value = price;
  document.getElementById("popup").style.display = "flex";
}

function closePopup() {
  document.getElementById("popup").style.display = "none";
}

async function saveUpdate() {
  const name = document.getElementById("updateName").value.trim();
  const price = parseFloat(document.getElementById("updatePrice").value);

  if (!name || isNaN(price) || price < 0) {
    alert("Please enter a valid name and numeric price.");
    return;
  }

  try {
    const res = await fetch(`${API_URL}/${currentUpdateId}`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name, price })
    });
    if (!res.ok) throw new Error("Failed to update product.");
    closePopup();
    loadProducts();
  } catch (err) {
    alert("Error updating product: " + err.message);
    console.error(err);
  }
}

loadProducts();
</script>

</body>
</html>
